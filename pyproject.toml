[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "chicago-taxi-fabric-lakehouse"
version = "0.1.0"
description = "Microsoft Fabric Data Pipeline and Spark notebook taxi lakehouse on OneLake"
requires-python = ">=3.11"
dependencies = ["tzdata>=2024.1"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "PyYAML>=6,<7"]
# Fabric Runtime 1.3 ships Spark 3.5; match it locally.
spark-test = ["pyspark>=3.5.3,<3.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/functional", "tests/integration", "tests/etl_validation", "tests/e2e"]
pythonpath = ["."]
