version: 1
layer: silver
status: implemented_pending_fabric_test
publication: full snapshot; independent Delta transactions; completed warehouse_loads audit required
time_semantics: Chicago local TIMESTAMP_NTZ; no inferred UTC instant
tables:
- name: lh_chicago_taxi.silver.fact_trip
  format: delta
  key: trip_id
  grain: one current accepted trip
  schema_sql: 'trip_id STRING, taxi_key STRING, company_key STRING, payment_type_key STRING,

    start_date_key INT, pickup_area_key INT, dropoff_area_key INT,

    trip_start_local TIMESTAMP_NTZ, trip_end_local TIMESTAMP_NTZ,

    trip_seconds BIGINT, trip_miles DECIMAL(18,6), trip_km DECIMAL(18,6),

    fare DECIMAL(18,2), tips DECIMAL(18,2), tolls DECIMAL(18,2), extras DECIMAL(18,2), trip_total DECIMAL(18,2),

    has_distance BOOLEAN, has_trip_total BOOLEAN, has_taxi_id BOOLEAN,

    landing_run_id STRING, payload_sha256 STRING, extracted_at_utc TIMESTAMP'
- name: lh_chicago_taxi.silver.dim_taxi
  format: delta
  key: taxi_key
  grain: one observed dimension member
  schema_sql: taxi_key STRING, taxi_id STRING, is_unknown BOOLEAN
- name: lh_chicago_taxi.silver.dim_company
  format: delta
  key: company_key
  grain: one observed dimension member
  schema_sql: company_key STRING, company_name STRING, is_unknown BOOLEAN
- name: lh_chicago_taxi.silver.dim_payment_type
  format: delta
  key: payment_type_key
  grain: one observed dimension member
  schema_sql: payment_type_key STRING, payment_type STRING, is_unknown BOOLEAN
- name: lh_chicago_taxi.silver.dim_date
  format: delta
  key: date_key
  grain: one observed dimension member
  schema_sql: date_key INT, calendar_date DATE, year INT, month INT, day INT, day_of_week INT
- name: lh_chicago_taxi.silver.dim_community_area
  format: delta
  key: area_key
  grain: one observed dimension member
  schema_sql: area_key INT, area_id INT, is_unknown BOOLEAN
- name: lh_chicago_taxi.silver.quarantine_trip
  format: delta
  key: trip_id
  grain: one rejected trip
  schema_sql: trip_id STRING, raw_payload STRING, quality_issues ARRAY<STRING>, landing_run_id STRING, payload_sha256 STRING,
    extracted_at_utc TIMESTAMP
foreign_keys:
- source: fact_trip.taxi_key
  target: dim_taxi.taxi_key
- source: fact_trip.company_key
  target: dim_company.company_key
- source: fact_trip.payment_type_key
  target: dim_payment_type.payment_type_key
- source: fact_trip.start_date_key
  target: dim_date.date_key
- source: fact_trip.pickup_area_key
  target: dim_community_area.area_key
- source: fact_trip.dropoff_area_key
  target: dim_community_area.area_key
